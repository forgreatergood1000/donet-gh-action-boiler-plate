name: Reuse .NET Build Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      working-directory:
        description: "Path to the .NET project folder"
        required: true
        default: "DotNet" # Change this default if needed

jobs:
  call-build:
    uses: "./.github/actions/build-dotnet"
    with:
      working-directory: ${{ github.event.inputs.working-directory || 'DotNet' }}
